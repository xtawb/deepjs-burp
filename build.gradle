// DeepJS for Burp Suite.
//
//     ./gradlew jar        →  build/libs/deepjs-burp.jar
//     ./gradlew harness    →  run the extension against a mocked Burp API
//
// The jar holds the extension (deepjs.burp) and its analysis engine (deepjs.engine)
// and has no dependencies: the Burp API is provided by Burp at run time.

plugins {
    id 'java'
}

group = 'io.github.xtawb'

repositories {
    mavenCentral()
}

dependencies {
    // the oldest API the code is written against: the jar loads in every Burp since then
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveVersion = ''
}

// src/test holds a program (deepjs.burp.Harness), not a JUnit suite
tasks.named('test') {
    enabled = false
}

tasks.register('harness', JavaExec) {
    group = 'verification'
    description = 'Runs the extension against a mocked Burp API, hostile input included.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'deepjs.burp.Harness'
    jvmArgs '-Djava.awt.headless=true'
}

check.dependsOn 'harness'
